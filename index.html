<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shizen — Learn Japanese in the conversation</title>
    <meta
      name="description"
      content="Shizen is an iPhone app for learning Japanese by listening, then speaking. Join the waitlist."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <span class="mark">Shizen</span>
    </header>

    <main class="hero">
      <section class="copy">
        <p class="kicker">Coming to iPhone</p>
        <h1>Learn Japanese by being in the conversation.</h1>
        <p class="lede">
          Listen cold. Catch the meaning. Step into the other person’s line.
        </p>

        <form id="waitlist" class="waitlist" novalidate>
          <label class="sr-only" for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@email.com"
            required
          />
          <button type="submit">Join the waitlist</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="device" aria-label="Shizen app preview">
        <div class="phone">
          <img
            class="screen-shot"
            src="./assets/app-home.jpg"
            alt="Shizen home screen with Daily Dialogue, lessons, and a yellow Start button"
          />
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>shizenapp.com</span>
    </footer>
    <script src="./app.js"></script>
  </body>
</html>
